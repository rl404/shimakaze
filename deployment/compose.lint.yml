services:
  shimakaze-lint:
    container_name: shimakaze-lint
    image: golangci/golangci-lint:v2.15.0
    working_dir: /shimakaze
    command: make lint
    environment:
      - GOFLAGS=-mod=vendor
    volumes:
      - ../:/shimakaze:ro
      - go-mod-cache:/go/pkg/mod
    profiles:
      - lint

volumes:
  go-mod-cache:
